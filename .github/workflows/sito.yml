# Pubblica la vetrina di Idea Garage (cartella sito/) sul ramo gh-pages,
# da cui GitHub Pages serve https://knghtlos.github.io/idea-garage/
name: Vetrina

on:
  push:
    branches: [main]
    paths: ['sito/**', '.github/workflows/sito.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vetrina
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna il ramo gh-pages con la cartella sito/
        run: |
          rm -f sito/aggiungi-gioco.mjs
          touch sito/.nojekyll
          cd sito
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Vetrina aggiornata da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
