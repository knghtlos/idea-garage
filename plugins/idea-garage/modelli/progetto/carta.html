<!doctype html>
<html lang="{{LINGUA}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITOLO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../motore/pagine.css">
  <style>:root { --colore: {{COLORE}}; }</style>
</head>
<body>
  <!-- CARTA DEL GIOCO. Il costruttore la riempie dalle risposte del detective.
       L'eroe mostrato qui è LO STESSO FILE che userà il gioco (assets/eroe.svg). -->
  <main class="pagina">
    <a class="torna" href="../../">← {{TESTO_PORTALE}}</a>
    <div class="carta-testata">
      <div class="palco" aria-hidden="true"><img src="assets/eroe.svg" alt=""></div>
      <div>
        <h1>{{TITOLO}}</h1>
        <p>{{FRASE_DEL_BAMBINO}}</p>
      </div>
    </div>

    <h2>{{TESTO_REGOLE}}</h2>
    <ul class="regole">
      <!-- Una regola per riga, frasi corte. Esempio:
      <li><span class="emoji">⬆️</span><span>Premi la freccia su e il drago salta.</span></li> -->
      {{REGOLE}}
    </ul>

    <h2>{{TESTO_TASTI_TITOLO}}</h2>
    <div class="riquadro tasti">{{TASTI}}</div>
  </main>
</body>
</html>
