<!doctype html>
<html lang="{{LINGUA}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITOLO}}: {{TESTO_COME_FATTO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../motore/pagine.css">
  <style>:root { --colore: {{COLORE}}; }</style>
</head>
<body>
  <!-- PAGINA "COME L'HO FATTO". Regole per chi la scrive (skill how-it-works):
       - Parole difficili: <span class="parola" data-termine="libreria">libreria</span>
         La chiave deve esistere in motore/glossario.json: le spiegazioni NON si scrivono qui.
       - Livello 1 si vede subito. Livelli 2 e 3 si aprono solo se il lettore li chiede.
       - Ogni pezzo di codice mostrato deve essere copiato ESATTAMENTE dal gioco
         (il robot collaudatore lo controlla). Si possono aggiungere solo commenti. -->
  <main class="pagina">
    <a class="torna" href="../../">← {{TESTO_PORTALE}}</a>
    <h1>{{TESTO_COME_FATTO}} {{TITOLO}}</h1>

    <!-- LIVELLO 1: la storia del gioco, con le foto -->
    <section data-livello="1">
      <p>{{INTRODUZIONE}}</p>
      <!-- Ripetere per ogni momento chiave:
      <div class="schermata">
        <img src="foto/salto.png" alt="Il drago salta su una nuvola">
        <button class="pezzo-bottone" style="left: 30%; top: 60%" data-mostra="pezzo-salto">il salto</button>
      </div>
      <p>Quando premi la freccia su, il drago salta perché...</p>
      -->
      {{STORIA}}
    </section>

    <!-- LIVELLO 2: i pezzi del gioco (codice vero, commentato) -->
    <section data-livello="2" data-invito="{{INVITO_LIVELLO_2}}">
      <h2>{{TESTO_PEZZI}}</h2>
      <!-- Ripetere per ogni pezzo:
      <details id="pezzo-salto" class="riquadro">
        <summary><h3 style="display:inline">Il salto</h3></summary>
        <p>Questa <span class="parola" data-termine="funzione">funzione</span> ...</p>
        <pre class="codice" data-da-file="gioco.js">...codice copiato dal gioco...</pre>
      </details>
      -->
      {{PEZZI}}
    </section>

    <!-- LIVELLO 3: gli attrezzi -->
    <section data-livello="3" data-invito="{{INVITO_LIVELLO_3}}">
      <h2>{{TESTO_ATTREZZI}}</h2>
      <div class="attrezzi">
        {{ATTREZZI}}
      </div>
    </section>
  </main>
  <script src="../../motore/come-funziona.js"></script>
</body>
</html>
